name: dj_app
description: "Music Mixer client - search songs, build mixes and play them."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

# NOTE: only pure-Dart packages. Native plugins are intentionally excluded
# because this machine cannot create symlinks (Developer Mode off, no admin),
# which Flutter requires to build any plugin-based app.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  provider: ^6.1.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
